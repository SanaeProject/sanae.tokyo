    <!-- main Start -->
    <main>
        <section class="content">
            <h2 class="slide-in">暗記カード</h2>
            <p class="slide-in">
                このページでは、暗記カードをweb上で作成、保存、学習することが出来ます。
            </p>
        </section>
        <section id="study" class="content">
            <h2 class="slide-in">暗記カード学習</h2>
            <label>カードをシャッフル
                <input type="checkbox" id="shuffle-checkbox" class="slide-in">
            </label><br>
            <label>
                質問と回答を入れ替える
                <input type="checkbox" id="reverse-checkbox" class="slide-in">
            </label><br>
            <input type="file" id="file-input" accept=".csv" class="slide-in"><br><br>
            <button id="game-start" class="next-btn">開始</button>
        </section>
        <script>
            const fileInput = document.getElementById('file-input');
            const gameStartButton = document.getElementById('game-start');
            const shuffleCheckbox = document.getElementById('shuffle-checkbox');
            const reverseCheckbox = document.getElementById('reverse-checkbox');
            let flashcards = [];
            
            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const content = e.target.result;
                        const lines = content.split('\n');
                        flashcards = lines.slice(1).map(line => {
                            const [question, answer] = line.split(',');
                            return { question: question, answer: answer };
                        }).filter(card => card.question && card.answer);
                    };
                    reader.readAsText(file);
                }
            });

            gameStartButton.addEventListener('click', function() {
                if (flashcards.length === 0) {
                    alert('まずCSVファイルを読み込んでください。');
                    return;
                }

                let correctCount = 0;
                if (shuffleCheckbox.checked) {
                    flashcards.sort(() => Math.random() - 0.5);
                }
                if( reverseCheckbox.checked ){
                    flashcards = flashcards.map(card => ({
                        question: card.answer,
                        answer: card.question
                    }));
                }
                
                let currentCardIndex = 0;
                const showCard = () => {
                    const card = flashcards[currentCardIndex];
                    const userAnswer = prompt(card.question);
                    if (userAnswer === null) return;

                    if (userAnswer.trim().toLowerCase() === card.answer.trim().toLowerCase()) {
                        alert('正解！');
                        correctCount++;
                    } else {
                        alert(`不正解。正しい答えは: ${card.answer}`);
                    }
                    currentCardIndex++;
                };
                while (currentCardIndex < flashcards.length)
                    showCard();

                alert(`学習終了！正解数: ${correctCount} / ${flashcards.length}`);
            });
        </script>

        <section id="create" class="content">
            <h2 class="slide-in">暗記カードの作成</h2>
            <p class="slide-in">
                暗記カードを作成するには、以下のフォームに質問と回答を入力し、「追加」ボタンをクリックしてください。
            </p>

            <!-- 追加したカードを表示 -->
            <table class="common">
                <thead>
                    <tr>
                        <th>質問</th>
                        <th>回答</th>
                    </tr>
                </thead>
                <tbody id="card-table-body">
                </tbody>
            </table>

            <!-- カード追加フォーム -->
            <form id="card-form" class="slide-in">
                <div>
                    <label for="question">質問:</label>
                    <input type="text" id="question" name="question" required>
                </div>
                <div>
                    <label for="answer">回答:</label>
                    <input type="text" id="answer" name="answer" required>
                </div>
                <div>
                    <button type="submit" class="next-btn">追加</button>
                    <button id="download-btn">保存</button>
                </div>
            </form>
            <script>
                const form = document.getElementById('card-form');
                form.addEventListener('submit', function(event) {
                    event.preventDefault();

                    const question = document.getElementById('question').value;
                    const answer = document.getElementById('answer').value;

                    const tableBody = document.getElementById('card-table-body');
                    const newRow = document.createElement('tr');

                    const questionCell = document.createElement('td');
                    questionCell.textContent = question;
                    newRow.appendChild(questionCell);

                    const answerCell = document.createElement('td');
                    answerCell.textContent = answer;
                    newRow.appendChild(answerCell);

                    tableBody.appendChild(newRow);

                    form.reset();
                });
                const downloadBtn = document.getElementById('download-btn');
                downloadBtn.addEventListener('click', function() {
                    const tableBody = document.getElementById('card-table-body');
                    const rows = tableBody.querySelectorAll('tr');
                    let csvContent = "data:text/csv;charset=utf-8,question,answer\n";

                    rows.forEach(row => {
                        const cols = row.querySelectorAll('td');
                        const question = cols[0].textContent;
                        const answer = cols[1].textContent;
                        csvContent += `${question},${answer}\n`;
                    });

                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement('a');
                    link.setAttribute('href', encodedUri);
                    link.setAttribute('download', 'flashcards.csv');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
            </script>
        </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => { 
            const elements = Array.from(document.querySelectorAll(".slide-in,.write")); 
            toggleVisibilityOnScroll( elements, (entry) => {
                if(entry.target.classList.contains("write")){
                    delayPrint(
                        entry.target, 
                        entry.target.textContent, 
                        100
                    );
                    entry.target.classList.remove("write");
                    entry.target.classList.add("wrote");
                }

                if(entry.target.classList.contains("slide-in"))
                    entry.target.classList.add("slide-in-visible");
                }, (entry) => {}
            ); 
        });
    </script>
